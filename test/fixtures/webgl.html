<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>webgl</title>
<style>
  body { margin: 0; background: #000; }
  canvas { display: block; width: 200px; height: 200px; }
</style>
</head>
<body>
<canvas width="200" height="200"></canvas>
<script>
  // WebGL: a background that a click changes, and a triangle. The drawing buffer isn't
  // preserved (the default), so only the browser's screenshot sees it.
  const canvas = document.querySelector('canvas');
  const gl = canvas.getContext('webgl2') ?? canvas.getContext('webgl');
  window.app = { ready: false, clicks: 0, error: gl ? null : 'no WebGL' };
  if (gl) {
    const shader = (type, src) => {
      const s = gl.createShader(type);
      gl.shaderSource(s, src);
      gl.compileShader(s);
      return s;
    };
    const program = gl.createProgram();
    gl.attachShader(program, shader(gl.VERTEX_SHADER, 'attribute vec2 p; void main() { gl_Position = vec4(p, 0.0, 1.0); }'));
    gl.attachShader(program, shader(gl.FRAGMENT_SHADER, 'precision mediump float; void main() { gl_FragColor = vec4(1.0, 1.0, 0.0, 1.0); }'));
    gl.linkProgram(program);
    gl.useProgram(program);
    gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
    // A triangle in the middle, clear of the corners.
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-0.5, -0.5, 0.5, -0.5, 0.0, 0.5]), gl.STATIC_DRAW);
    gl.enableVertexAttribArray(0);
    gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
    const backgrounds = [[0, 0, 1], [0, 1, 0]];
    const draw = () => {
      gl.clearColor(...backgrounds[app.clicks % 2], 1);
      gl.clear(gl.COLOR_BUFFER_BIT);
      gl.drawArrays(gl.TRIANGLES, 0, 3);
    };
    canvas.addEventListener('click', () => {
      app.clicks++;
      requestAnimationFrame(draw);
    });
    requestAnimationFrame(() => (draw(), (app.ready = true)));
  }
</script>
</body>
</html>
