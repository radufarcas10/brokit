<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Plan card</title>
<link rel="stylesheet" href="demo.css">
<script src="card.js" defer></script>
</head>
<body class="center">
<article class="card">
  <p class="tier">Team</p>
  <p class="price"><span id="price">$12</span><small> / seat / month</small></p>
  <ul>
    <li>Unlimited projects</li>
    <li>Checks on every pull request</li>
    <li>Screenshots kept 90 days</li>
  </ul>
  <button id="buy">Start free trial</button>
</article>
</body>
</html>
