<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Today</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="card">
  <h1>Today</h1>
  <form id="add">
    <input id="new" placeholder="Add a task" autocomplete="off" aria-label="New task">
    <button>Add</button>
  </form>
  <ul id="list"></ul>
  <p class="hint">Space ticks a task off. Ctrl+Z (⌘Z on a Mac) undoes.</p>
</main>
<script src="app.js"></script>
</body>
</html>
